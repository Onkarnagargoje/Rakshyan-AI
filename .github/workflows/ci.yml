name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Required: regression file + in-process graph (no server).
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Pytest (agent regression)
        env:
          PYTHONPATH: .
          ENABLE_OLLAMA: "0"
        run: pytest tests/test_agent_regression.py -q

      - name: E2E batch (local graph, 18 cases)
        env:
          PYTHONPATH: .
          ENABLE_OLLAMA: "0"
        run: python scripts/e2e_score_batch.py --local

  # Optional: full HTTP batch vs local graph parity (catches stale/wrong Uvicorn).
  backend-http-e2e:
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Uvicorn + HTTP e2e batch + compare-local
        env:
          PYTHONPATH: .
          ENABLE_OLLAMA: "0"
          DATABASE_URL: sqlite+aiosqlite:///./ci_http_e2e.db
          E2E_API_BASE: http://127.0.0.1:9999
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 9999 &
          UV_PID=$!
          sleep 6
          python scripts/e2e_score_batch.py --compare-local --base-url "$E2E_API_BASE"
          EC=$?
          kill $UV_PID 2>/dev/null || true
          exit $EC
